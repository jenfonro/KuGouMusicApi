name: Songloft fork binaries

on:
  push:
    tags:
      - 'v*-songloft.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: songloft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'jenfonro/KuGouMusicApi' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref, '-songloft.')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2022
            platform: win
          - os: macos-15-intel
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve source bytes on Windows too
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Validate fork, tag, commit and lock format
        run: node scripts/release-build.cjs --check
      - name: Install pinned tooling (no lifecycle scripts)
        run: npm ci --prefix tools/build --ignore-scripts --no-audit --no-fund
      - name: Install production dependencies from the original lock
        run: node tools/build/node_modules/pnpm/bin/pnpm.cjs install --prod --frozen-lockfile --ignore-scripts
      - name: Test API payloads, build pkg binary, smoke and collect notices
        # Runs node --test tests/user_listen_report.test.js before packaging.
        run: node scripts/release-build.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: songloft-${{ matrix.platform }}-x64
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    if: >-
      github.repository == 'jenfonro/KuGouMusicApi' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v') &&
      contains(github.ref, '-songloft.')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: songloft-*-x64
          merge-multiple: true
          path: dist/release
      - name: Verify all assets, upload draft, verify GitHub digests, publish
        run: node scripts/release-publish.cjs
        env:
          GH_TOKEN: ${{ github.token }}
